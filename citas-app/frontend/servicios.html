<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios | Gestión de Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="agenda.html">Gestión de Citas</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="agenda.html">Agenda</a></li>
          <li class="nav-item"><a class="nav-link active" href="servicios.html">Servicios</a></li>
          <li class="nav-item admin-only d-none"><a class="nav-link" href="clientes.html">Clientes</a></li>
        </ul>
        <span class="navbar-text text-light me-3" id="nombreUsuario"></span>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="alerta"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Servicios disponibles</h4>
      <button class="btn btn-primary admin-only d-none" data-bs-toggle="modal" data-bs-target="#modalServicio" onclick="abrirModalNuevoServicio()">
        + Nuevo servicio
      </button>
    </div>

    <div class="row g-3" id="listaServicios"></div>
  </div>

  <!-- Modal servicio -->
  <div class="modal fade" id="modalServicio" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formServicio">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalServicio">Nuevo servicio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="servicioIdEdit">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" id="descripcion" rows="2"></textarea>
            </div>
            <div class="row">
              <div class="col mb-3">
                <label class="form-label">Duración (min)</label>
                <input type="number" class="form-control" id="duracion_minutos" required min="5">
              </div>
              <div class="col mb-3">
                <label class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" id="precio" required min="0">
              </div>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="activo" checked>
              <label class="form-check-label" for="activo">Activo</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/servicios.js"></script>
</body>
</html>
