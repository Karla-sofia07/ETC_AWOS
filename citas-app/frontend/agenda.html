<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Gestión de Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="agenda.html">Gestión de Citas</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="agenda.html">Agenda</a></li>
          <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
          <li class="nav-item admin-only d-none"><a class="nav-link" href="clientes.html">Clientes</a></li>
        </ul>
        <span class="navbar-text text-light me-3" id="nombreUsuario"></span>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="alerta"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 class="mb-0">Mis citas</h4>
      <div class="d-flex gap-2">
        <input type="date" id="filtroFecha" class="form-control">
        <button class="btn btn-outline-secondary" id="btnLimpiarFiltro">Limpiar</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCita" onclick="abrirModalNuevaCita()">
          + Nueva cita
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover bg-white align-middle">
        <thead class="table-light">
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Servicio</th>
            <th class="admin-only d-none">Cliente</th>
            <th>Estado</th>
            <th>Notas</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaCitas">
          <tr><td colspan="7" class="text-center text-muted">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal para agendar / editar cita -->
  <div class="modal fade" id="modalCita" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formCita">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalCita">Nueva cita</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="citaId">
            <div class="mb-3">
              <label class="form-label">Servicio</label>
              <select class="form-select" id="servicioId" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Hora</label>
              <input type="time" class="form-control" id="hora" required>
            </div>
            <div class="mb-3 admin-only d-none">
              <label class="form-label">Estado</label>
              <select class="form-select" id="estado">
                <option value="pendiente">Pendiente</option>
                <option value="confirmada">Confirmada</option>
                <option value="completada">Completada</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Notas (opcional)</label>
              <textarea class="form-control" id="notas" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agenda.js"></script>
</body>
</html>
