<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | Gestión de Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="agenda.html">Gestión de Citas</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="agenda.html">Agenda</a></li>
          <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link active" href="clientes.html">Clientes</a></li>
        </ul>
        <span class="navbar-text text-light me-3" id="nombreUsuario"></span>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="alerta"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Clientes</h4>
      <input type="text" id="buscar" class="form-control" style="max-width: 250px;" placeholder="Buscar por nombre o correo">
    </div>

    <div class="row">
      <div class="col-md-5">
        <div class="table-responsive">
          <table class="table table-hover bg-white">
            <thead class="table-light">
              <tr><th>Nombre</th><th>Correo</th><th></th></tr>
            </thead>
            <tbody id="tablaClientes"></tbody>
          </table>
        </div>
      </div>
      <div class="col-md-7">
        <h5>Historial de citas</h5>
        <div id="historialWrapper" class="text-muted">Selecciona un cliente para ver su historial.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
